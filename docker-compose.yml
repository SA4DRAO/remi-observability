version: '3.9'

services:
  backend:
    build:
      context: ./remi-backend
      dockerfile: Dockerfile
    container_name: remi-backend
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: development
      PORT: 3100
      HOST: 0.0.0.0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk_test_}
      BROWSER_HEADLESS: "true"
      BROWSER_TIMEOUT: 15000
      BROWSER_SANDBOX: "false"
      CORS_ORIGINS: "http://localhost:3000,http://frontend:3000,http://localhost:5173"
      LOG_LEVEL: debug
    volumes:
      - ./remi-backend/src:/app/src
      - ./remi-backend/screenshots:/app/screenshots
    restart: unless-stopped
    networks:
      - remi-network

  frontend:
    build:
      context: ./remi/remi
      dockerfile: Dockerfile
    container_name: remi-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://backend:3100"
      VITE_ENV: development
      VITE_ENABLE_DEBUG: "true"
    volumes:
      - ./remi/remi/src:/app/src
    restart: unless-stopped
    networks:
      - remi-network

networks:
  remi-network:
    driver: bridge

volumes:
  screenshots:
