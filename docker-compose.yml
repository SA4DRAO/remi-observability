services:
  postgres-primary:
    image: docker.io/library/postgres:16-alpine
    container_name: postgres-primary
    environment:
      POSTGRES_USER: remi_user
      POSTGRES_PASSWORD: remi_password
      POSTGRES_DB: remi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - remi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remi_user -d remi_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:24.6-alpine
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: remi
      CLICKHOUSE_USER: remi_user
      CLICKHOUSE_PASSWORD: remi_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP interface (used by backend)
      - "9000:9000"   # Native TCP (used by OTel Collector)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - remi-network
    restart: unless-stopped
    healthcheck:
      # Use 127.0.0.1 (not localhost): inside the container localhost resolves to
      # IPv6 [::1], but ClickHouse listens on IPv4 only, so localhost gives a false
      # "Connection refused" and the container is wrongly marked unhealthy.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # API Backend — Spring Boot
  backend:
    build:
      context: ./remi-backend-spring
      dockerfile: Dockerfile
    container_name: remi-backend
    ports:
      - "3100:3100"
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://frontend:3000"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: remi_user
      CLICKHOUSE_PASSWORD: remi_password
      CLICKHOUSE_DB: remi
      POSTGRES_HOST: postgres-primary
      POSTGRES_PORT: 5432
      POSTGRES_DB: remi_db
      POSTGRES_USER: remi_user
      POSTGRES_PASSWORD: remi_password
      COLLECTOR_ENDPOINT: http://otel-collector:4318
      # LLM-as-judge (OpenRouter; falls back to OPENAI_API_KEY if unset)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-openai/gpt-4o-mini}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - remi-network

  # Frontend
  frontend:
    build:
      context: ./remi/remi
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time. Empty default = runtime
        # detection in env.ts: localhost origins call http://localhost:3100,
        # any other origin (tailscale serve) calls the same-origin /api proxy.
        VITE_API_URL: "${VITE_API_URL:-}"
        # Dashboard key for the sample org (seeded in init-db.sql, dev only)
        VITE_API_KEY: ${REMI_API_KEY:-acme-admin-key}
        VITE_ENV: development
        VITE_ENABLE_DEBUG: "true"
    container_name: remi-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - remi-network

  # Marketing site (static, independent of the platform)
  marketing:
    build:
      context: ./remi-marketing
      dockerfile: Dockerfile
    container_name: remi-marketing
    ports:
      - "3200:3200"
    restart: unless-stopped
    networks:
      - remi-network

  # Demo feeder — loops the example agents against the public demo org so the
  # marketing site's "View live demo" always has fresh sessions. Needs an LLM
  # key; exits harmlessly into retry loops without one.
  demo-feeder:
    build:
      context: ./examples
      dockerfile: Dockerfile
    container_name: remi-demo-feeder
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://backend:3100
      REMI_INGEST_KEY: demo-ingest-key
      REMI_ORG_ID: demo-org
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FEED_INTERVAL: ${FEED_INTERVAL:-900}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - remi-network

  # Distributed Tracing — Jaeger all-in-one
  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.60
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
    networks:
      - remi-network
    restart: unless-stopped

  # OpenTelemetry Collector
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.105.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
    environment:
      CLICKHOUSE_USER: remi_user
      CLICKHOUSE_PASSWORD: remi_password
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector-config.yaml:ro
    ports:
      # Loopback only — external ingest must go through the backend's
      # authenticated /v1/traces proxy on :3100. For tailnet ingest, point
      # `tailscale serve` at the backend instead of this port.
      - "127.0.0.1:4318:4318"
    depends_on:
      jaeger:
        condition: service_started
      clickhouse:
        condition: service_healthy
    networks:
      - remi-network
    restart: unless-stopped

networks:
  remi-network:
    driver: bridge

volumes:
  postgres_primary_data:
  clickhouse_data:
