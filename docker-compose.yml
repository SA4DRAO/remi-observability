services:
  postgres-primary:
    image: docker.io/library/postgres:16-alpine
    container_name: postgres-primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remi_password}
      POSTGRES_DB: ${POSTGRES_DB:-remi_db}
    # No host port: nothing outside the compose network needs Postgres, and
    # publishing 5432 put the identity store on the box's public interface.
    # Admin access is `docker exec -it postgres-primary psql -U remi_user -d remi_db`.
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - remi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remi_user -d remi_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:24.6-alpine
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-remi}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-remi_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-remi_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    # No host ports: the backend (8123) and collector (9000) reach ClickHouse over
    # the compose network. Published, they exposed every org's prompts unauthenticated
    # to anyone who could reach the host. Use `docker exec -it clickhouse clickhouse-client`.
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - remi-network
    restart: unless-stopped
    healthcheck:
      # Use 127.0.0.1 (not localhost): inside the container localhost resolves to
      # IPv6 [::1], but ClickHouse listens on IPv4 only, so localhost gives a false
      # "Connection refused" and the container is wrongly marked unhealthy.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # API Backend — Spring Boot
  backend:
    build:
      context: ./remi-backend-spring
      dockerfile: Dockerfile
    container_name: remi-backend
    ports:
      # Loopback only, same reasoning as otel-collector below: in --profile prod,
      # Caddy is the only intended way in (it reaches this container over
      # remi-network by service name, which host port binding doesn't affect).
      # A 0.0.0.0 bind here would be one open cloud firewall rule away from
      # letting anyone skip Caddy + oauth2-proxy entirely.
      - "127.0.0.1:3100:3100"
    environment:
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://frontend:3000"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-remi_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-remi_password}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-remi}
      POSTGRES_HOST: postgres-primary
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-remi_db}
      POSTGRES_USER: ${POSTGRES_USER:-remi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remi_password}
      COLLECTOR_ENDPOINT: http://otel-collector:4318
      # Empty locally: proxy-user auth stays off and the bearer key is the only
      # way in. Set (with Caddy in front) to enable SSO dashboard logins.
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      # LLM-as-judge (OpenRouter; falls back to OPENAI_API_KEY if unset)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-openai/gpt-4o-mini}
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - remi-network

  # Frontend
  frontend:
    build:
      context: ./remi/remi
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time. Empty default = runtime
        # detection in env.ts: localhost origins call http://localhost:3100,
        # any other origin (tailscale serve) calls the same-origin /api proxy.
        VITE_API_URL: "${VITE_API_URL:-}"
        # Dashboard key for the sample org (seeded in init-db.sql, dev only)
        VITE_API_KEY: ${REMI_API_KEY:-acme-admin-key}
        VITE_ENABLE_DEBUG: "true"
    container_name: remi-frontend
    ports:
      # Loopback only — see the backend service's port comment above. Caddy
      # reaches this container by service name over remi-network regardless.
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - remi-network

  # Marketing site (static, independent of the platform)
  marketing:
    build:
      context: ./remi-marketing
      dockerfile: Dockerfile
    container_name: remi-marketing
    ports:
      - "3200:3200"
    restart: unless-stopped
    networks:
      - remi-network

  # Demo feeder — loops the example agents against the public demo org so the
  # marketing site's "View live demo" always has fresh sessions. Needs an LLM
  # key; exits harmlessly into retry loops without one.
  demo-feeder:
    build:
      context: ./examples
      dockerfile: Dockerfile
    container_name: remi-demo-feeder
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://backend:3100
      REMI_INGEST_KEY: demo-ingest-key
      REMI_ORG_ID: demo-org
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      FEED_INTERVAL: ${FEED_INTERVAL:-900}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - remi-network

  # ── Hosted deployment only (profile: prod) ──────────────────────────────────
  # `docker compose --profile prod up -d`. Without the profile the local stack is
  # unchanged and unauthenticated, exactly as before.
  #
  # Caddy terminates TLS (auto-cert for REMI_DOMAIN), routes /v1/* straight to the
  # backend for agent ingest, and gates everything else behind oauth2-proxy.
  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: remi-caddy
    profiles: [prod]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Both required in .env for the prod profile; unset, Caddy refuses to start
      # and an empty secret means the backend rejects every login. Never silent.
      # Generate the secret with: openssl rand -hex 32
      REMI_DOMAIN: ${REMI_DOMAIN:-}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - oauth2-proxy
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - remi-network

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: remi-oauth2-proxy
    profiles: [prod]
    command:
      # Caddy routes traffic; oauth2-proxy only answers /oauth2/* and the auth probe.
      - --upstream=static://202
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --skip-provider-button=true
    environment:
      OAUTH2_PROXY_PROVIDER: ${OAUTH2_PROVIDER:-google}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:-}
      # Generate with: openssl rand -base64 32 | head -c 32 | base64
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET:-}
      OAUTH2_PROXY_REDIRECT_URL: "https://${REMI_DOMAIN}/oauth2/callback"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      # Who may reach the login at all. Membership in org_members is the real
      # authorization check — this only narrows who can start a session.
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_EMAIL_DOMAINS:-*}
    restart: unless-stopped
    networks:
      - remi-network

  # Distributed Tracing — Jaeger all-in-one
  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.60
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
    networks:
      - remi-network
    restart: unless-stopped

  # OpenTelemetry Collector
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.105.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-remi_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-remi_password}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector-config.yaml:ro
    ports:
      # Loopback only — external ingest must go through the backend's
      # authenticated /v1/traces proxy on :3100. For tailnet ingest, point
      # `tailscale serve` at the backend instead of this port.
      - "127.0.0.1:4318:4318"
    depends_on:
      jaeger:
        condition: service_started
      clickhouse:
        condition: service_healthy
    networks:
      - remi-network
    restart: unless-stopped

networks:
  remi-network:
    driver: bridge

volumes:
  postgres_primary_data:
  clickhouse_data:
  caddy_data:
  caddy_config:
