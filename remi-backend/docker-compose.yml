version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3100}:3100"
    environment:
      NODE_ENV: development
      PORT: 3100
      HOST: 0.0.0.0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk_test_}
      BROWSER_HEADLESS: "true"
      BROWSER_TIMEOUT: "15000"
      BROWSER_SANDBOX: "false"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
      start_period: 10s

networks:
  remi-network:
    driver: bridge

volumes:
  screenshots:
