# Standalone docker-compose for remi-backend development.
# Use the root docker-compose.yml to run the full stack (recommended).
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: remi_user
      POSTGRES_PASSWORD: remi_password
      POSTGRES_DB: remi_db
    ports:
      - "5432:5432"
    volumes:
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remi_user -d remi_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_password
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis_password ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: development
      PORT: 3100
      HOST: 0.0.0.0
      REMI_API_KEY: ${REMI_API_KEY:-test-key-123}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: remi_user
      DB_PASSWORD: remi_password
      DB_NAME: remi_db
      DB_READ_HOST: postgres
      DB_READ_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: ["bun", "run", "src/index.ts"]

volumes:
  postgres_data:
