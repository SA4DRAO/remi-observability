[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remi-langchain"
version = "0.1.0"
description = "LangChain utilities and CLI for sentiment analysis with structured callbacks and processing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Remi", email = "dev@example.com"}]
dependencies = [
  "langchain-core>=0.3.8",
  "langchain-community>=0.3.3",
  "langchain-openai>=0.2.3",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.8.0",
  "black>=24.3.0",
]

[project.scripts]
remi-langchain = "remi_langchain.cli:main"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
strict_optional = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["remi_langchain*"]