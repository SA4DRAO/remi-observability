[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remi-worker"
version = "1.0.0"
description = "Remi Background Worker – Kafka consumer for event processing"
requires-python = ">=3.9"
dependencies = [
    "aiokafka>=0.10.0",
    "asyncpg>=0.28.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.scripts]
remi-worker = "remi_worker.__main__:run"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remi_worker = ["py.typed"]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["src"]
