# Standalone docker-compose for remi (frontend) development.
# Use the root docker-compose.yml to run the full stack (recommended).
services:
  frontend:
    build:
      context: ./remi
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3100}
        VITE_API_KEY: ${REMI_API_KEY:-test-key-123}
        VITE_ENABLE_DEBUG: "true"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
