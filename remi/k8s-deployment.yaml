apiVersion: apps/v1
kind: Deployment
metadata:
  name: remi-frontend
  labels:
    app: remi
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: remi
      component: frontend
  template:
    metadata:
      labels:
        app: remi
        component: frontend
    spec:
      containers:
      - name: frontend
        image: remi-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: VITE_API_URL
          valueFrom:
            configMapKeyRef:
              name: remi-config
              key: api-url
        - name: VITE_ENV
          value: "production"
        - name: VITE_ENABLE_DEBUG
          value: "false"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: remi-frontend-service
  labels:
    app: remi
    component: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: remi
    component: frontend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remi-config
data:
  api-url: "https://api.example.com"
